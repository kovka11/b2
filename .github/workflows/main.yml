name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (alairas nelkul)
        run: |
          xcodebuild \
            -project BazisChat.xcodeproj \
            -target BazisChat \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: ipa csomagolas
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/BazisChat.app Payload/
          zip -qr BazisChat.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BazisChat-ipa
          path: BazisChat.ipa
